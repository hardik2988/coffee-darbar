<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Coffee Darbar · Jharokha steam crown.
       A Rajasthani jharokha (arched palace window) framing a coffee cup. Its steam rises
       as one soft, wavy line that traces a three-point crown, each point set with a jewel. -->
  <defs>
    <!-- user-space gradient so straight lines (ledge, saucer) still get colour -->
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="8" y1="4" x2="56" y2="76">
      <stop offset="0" stop-color="#f3dca6"/><stop offset=".5" stop-color="#c9a15f"/><stop offset="1" stop-color="#a87e3e"/>
    </linearGradient>
  </defs>
  <g stroke="url(#g)">
    <!-- finial -->
    <path d="M32 0.8 L34 3.6 L32 6.4 L30 3.6 Z" fill="url(#g)" stroke-width="0.8"/>
    <!-- jharokha: outer ogee arch, inner arch, ledge (chhajja) and two corbels -->
    <path d="M10 66 V34 C10 23 18 18 24.5 14 C28.5 11.5 31 9.4 32 7.6 C33 9.4 35.5 11.5 39.5 14 C46 18 54 23 54 34 V66" stroke-width="2.2"/>
    <path d="M15 66 V35 C15 27 21 23 26 19.6 C29 17.6 31 15.6 32 13.6 C33 15.6 35 17.6 38 19.6 C43 23 49 27 49 35 V66" stroke-width="1" opacity=".55"/>
    <path d="M4 66 H60" stroke-width="2.2"/>
    <path d="M7 70.5 H57" stroke-width="1.2"/>
    <path d="M12 70.5 Q15 76.5 18 70.5 M46 70.5 Q49 76.5 52 70.5" stroke-width="1.2"/>
    <!-- saucer + cup handle -->
    <path d="M21 62 H43" stroke-width="2"/>
    <path d="M41 51 C46 50.6 46 57 40 57.3" stroke-width="1.7"/>
    <!-- steam crown: band, then one wavy line over three points -->
    <path d="M24.5 46.8 Q32 44.6 39.5 46.8" stroke-width="1.3"/>
    <path class="j-steam" d="M24.5 46.4 C23 42 26.5 38.5 25 34 C26.8 36 28 38.5 28.8 40.6 C29.5 36 31.5 33 32 29 C32.5 33 34.5 36 35.2 40.6 C36 38.5 37.2 36 39 34 C37.5 38.5 41 42 39.5 46.4" stroke-width="1.5"/>
    <path class="j-wisp" d="M32 24.6 C30.8 22.4 33.2 20.6 32 17.8" stroke-width="1.1" opacity=".6"/>
  </g>
  <path d="M22.5 49 H41.5 C41.5 55.5 38 59.5 32 59.5 C26 59.5 22.5 55.5 22.5 49 Z" fill="url(#g)"/>
  <g fill="url(#g)"><circle cx="25" cy="32.4" r="1.5"/><circle cx="32" cy="27.2" r="1.6"/><circle cx="39" cy="32.4" r="1.5"/></g>
</svg>
